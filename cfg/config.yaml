features:
  # Pitch characteristics
  - [release_speed, numeric, {}]
  - [release_pos_x, numeric, {}]
  - [release_pos_z, numeric, {}]
  - [release_spin_rate, numeric, {}]
  - [spin_axis, numeric, {}]
  - [release_extension, numeric, {}]
  - [pfx_x, numeric, {}]
  - [pfx_z, numeric, {}]
  - [plate_x, numeric, {}]
  - [plate_z, numeric, {}]

  # situation
  - [balls, numeric, {}]
  - [strikes, numeric, {}]

  # pitcher info
  - [p_throws, categorical, {}]

  # batter info
  - [stand, categorical, {}]
  - [sz_top, numeric, {}]
  - [sz_bot, numeric, {}]

targets: []

keys:
  - game_pk
  - at_bat_number
  - pitch_number

# For testing mainly
aux_cols:
  - description

train_data_path: ./data/2023_data.parquet
split_seed: 212
morphers_path: ./data/morphers.yaml

morpher_dispatch:
  numeric: Normalizer
  categorical: Integerizer

core_net_params:
  embedding_size: 256
  tr_n_layers: 4
  n_kv_heads: 4
  n_q_heads: 8
  ff_dim: 768

bt_params:
  name: barlow_twins
  mask_p: 0.5
  masking_strategy: learned
  projection_size: 64
  proj_n_layers: 4
  loss_params:
    lambda_: 10
  lr: 0.0001
  weight_decay: 0.01
  

training_params:
  batch_size: 4096
  epochs: 3
  precision: 16-mixed
